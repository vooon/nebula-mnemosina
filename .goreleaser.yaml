version: 2

project_name: nebula-mnemosina

before:
  hooks:
    - go mod tidy
    - sqlc generate

builds:
  - id: nebula-mnemosina
    main: ./cmd/nebula-mnemosina
    binary: nebula-mnemosina
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/prometheus/common/version.Version={{ .Version }}
      - -X github.com/prometheus/common/version.Revision={{ .Commit }}
      - -X github.com/prometheus/common/version.Branch={{ .Branch }}
      - -X github.com/prometheus/common/version.BuildUser=goreleaser
      - -X github.com/prometheus/common/version.BuildDate={{ .Date }}

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

dockers_v2:
  - id: nebula-mnemosina
    ids:
      - nebula-mnemosina
    dockerfile: Dockerfile.goreleaser
    images:
      - ghcr.io/vooon/nebula-mnemosina
    tags:
      - "{{ .Tag }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64

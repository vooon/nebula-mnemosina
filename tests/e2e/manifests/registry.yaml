apiVersion: apps/v1
kind: Deployment
metadata:
  name: nebula-mnemosina-registry
  labels:
    app: nebula-mnemosina-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nebula-mnemosina-registry
  template:
    metadata:
      labels:
        app: nebula-mnemosina-registry
    spec:
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: registry:2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: registry
              containerPort: 5000
          env:
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
          volumeMounts:
            - name: storage
              mountPath: /var/lib/registry
      volumes:
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nebula-mnemosina-registry
  labels:
    app: nebula-mnemosina-registry
spec:
  selector:
    app: nebula-mnemosina-registry
  ports:
    - name: registry
      port: 5000
      targetPort: registry

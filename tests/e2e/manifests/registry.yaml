apiVersion: apps/v1
kind: Deployment
metadata:
  name: nebula-mnemosina-registry
  namespace: nebula-mnemosina-e2e
  labels:
    app: nebula-mnemosina-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nebula-mnemosina-registry
  template:
    metadata:
      labels:
        app: nebula-mnemosina-registry
    spec:
      containers:
        - name: registry
          image: registry:2
          imagePullPolicy: IfNotPresent
          ports:
            - name: registry
              containerPort: 5000
          env:
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
          volumeMounts:
            - name: storage
              mountPath: /var/lib/registry
      volumes:
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nebula-mnemosina-registry
  namespace: nebula-mnemosina-e2e
  labels:
    app: nebula-mnemosina-registry
spec:
  type: NodePort
  selector:
    app: nebula-mnemosina-registry
  ports:
    - name: registry
      port: 5000
      targetPort: registry
      nodePort: 30500

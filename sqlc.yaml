version: "2"
sql:
  - engine: postgresql
    schema:
      - db/migrations/core/001_schema.sql
      - db/migrations/views/001_grafana_views.sql
    queries:
      - db/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false

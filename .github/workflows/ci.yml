name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - initial

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.29.0"
      - run: sqlc generate
      - run: git diff --exit-code -- internal/db
      - run: go test ./...
        env:
          CGO_ENABLED: "0"
      - run: go build ./cmd/nebula-mnemosina
        env:
          CGO_ENABLED: "0"
